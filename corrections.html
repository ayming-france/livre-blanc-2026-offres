<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Livre blanc 2026, corrections</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
#fix col.c-p{width:56px} #fix col.c-w{width:120px} #fix col.c-cur{width:22%} #fix col.c-fix{width:auto} #fix col.c-t{width:110px} #fix col.c-img{width:200px} #fix col.c-src{width:150px}
.shot{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in;transition:border-color .15s ease-out}
.shot:hover{border-color:var(--accent)}
.shot img{display:block;width:100%;height:auto}
.links{display:grid;gap:4px;justify-items:start}
.links a,.links button{font:inherit;font-size:13px;font-weight:700;color:var(--mid);background:none;border:none;padding:0;cursor:pointer;text-decoration:none}
.links a:hover,.links button:hover{text-decoration:underline}

/* Modal viewer */
dialog.viewer{border:none;padding:0;border-radius:12px;background:var(--raised);box-shadow:0 10px 40px rgba(0,0,0,.18);width:min(1100px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:hidden}
dialog.viewer::backdrop{background:rgba(15,23,42,.55)}
dialog.viewer[open]{display:grid;grid-template-rows:auto minmax(0,1fr) auto;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.v-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.v-head .t{display:grid;gap:1px;min-width:0}
.v-head .t b{color:var(--strong);font-size:14px}
.v-head .t span{color:var(--muted);font-size:13px}
.v-head .pos{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;color:var(--body);cursor:pointer}
.ibtn:hover{background:var(--hover)}
.ibtn:disabled{opacity:.4;cursor:default;background:none}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.v-img{overflow:auto;background:var(--canvas);display:grid;place-items:start center}
.v-img img{display:block;max-width:100%;height:auto}
.v-foot{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:2px;font-size:13px;color:var(--body)}
.v-foot b{color:var(--strong)}
@media (max-width:960px){.shot{max-width:360px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Livre blanc 2026 et offres RH</h1>
  <p class="lead">Dix points à corriger avant publication. Les numéros de page sont ceux du PDF.</p>
  <nav class="tabs" aria-label="Pages">
    <a href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>Propositions et offres <span class="c">16</span></a>
    <a href="corrections.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>Corrections avant publication <span class="c">10</span></a>
  </nav>
</header>

<section aria-label="Corrections">
  <div class="view">
    <div class="toolbar" role="toolbar" aria-label="Filtres des corrections">
      <span class="fbtn" id="fb-type"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg><span class="lbl">Type</span><select id="f-type" aria-label="Filtrer par type de correction"></select></span>
      <span class="spacer"></span>
      <span class="meta" id="count2"></span>
    </div>
    <table id="fix">
      <colgroup><col class="c-p"><col class="c-w"><col class="c-cur"><col class="c-fix"><col class="c-t"><col class="c-img"><col class="c-src"></colgroup>
      <thead><tr><th><span>Page</span></th><th><span>Où</span></th><th><span>Texte actuel</span></th><th><span>Correction proposée</span></th><th><span>Type</span></th><th><span>Capture</span></th><th><span>Lien</span></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>
</div>

<dialog class="viewer" id="viewer" aria-labelledby="v-title">
  <div class="v-head">
    <div class="t"><b id="v-title"></b><span id="v-where"></span></div>
    <span class="pos" id="v-pos"></span>
    <button class="ibtn" id="v-prev" aria-label="Capture précédente"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="ibtn" id="v-next" aria-label="Capture suivante"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="ibtn" id="v-close" aria-label="Fermer" autofocus><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="v-img"><img id="v-img" alt=""></div>
  <div class="v-foot"><span><b>Correction proposée.</b> <span id="v-fix"></span></span></div>
</dialog>

<script>
(function(){
  var TYPES={err:"Erreur",chk:"À vérifier",voc:"Vocabulaire",upd:"Mise à jour"};
  var TYPE_DOT={err:"d-none",chk:"d-part",voc:"d-prac",upd:"d-pol"};
  var fixes=[
    {p:3,where:"À propos d'Ayming",cur:"« pour garantir une mise en oeuvre efficace des dispositifs réglementaires »",fix:"« pour faciliter une mise en œuvre efficace… ». Ayming ne s'engage pas sur un résultat dans ses supports.",t:"voc",img:"p03-garantir"},
    {p:12,where:"P3, constat",cur:"Frais professionnels : « 54 millions d'euros sur les 800 millions au total » en 2023",fix:"Citer le bilan URSSAF d'où vient le chiffre, ou le retirer. Il n'apparaît pas dans les bilans publiés, et 800 M€ correspond à un chiffre 2022 de lutte contre la fraude.",t:"chk",img:"p12-chiffre"},
    {p:17,where:"Axe 2, constat",cur:"« La doctrine administrative s'est imposée en pratique comme une source de droit… » apparaît en gras, puis à nouveau mot pour mot juste en dessous",fix:"Garder une seule occurrence.",t:"err",img:"p17-doublon"},
    {p:24,where:"P8, constat",cur:"Ne mentionne pas la réforme de l'incapacité permanente",fix:"Ajouter une phrase : depuis le 1er novembre 2026, deux taux (professionnel et fonctionnel) sont fixés, ce qui multiplie les décisions à lire.",t:"upd",src:{label:"Tissot",url:"https://www.editions-tissot.fr/actualite/sante-securite/reforme-de-lindemnisation-de-lincapacite-permanente-at-mp-le-nouveau-regime-applicable-est-precise"}},
    {p:24,where:"P8, mesure 2",cur:"Le titre porte sur l'inopposabilité, mais le paragraphe décrit une expertise contradictoire avant la CMRA, qui est l'objet de la mesure 3",fix:"Rédiger un paragraphe sur l'inopposabilité, ou fusionner avec la mesure 3.",t:"err",img:"p24-mesure2"},
    {p:25,where:"P8, mesure 3",cur:"« l'inopposabilité prévue en Proposition 12 »",fix:"« l'inopposabilité prévue à la mesure 2 ». La mesure 4 donne déjà la bonne référence.",t:"err",img:"p25-renvoi"},
    {p:25,where:"P8, mesures 3 et 4",cur:"La même phrase (« lève l'obstacle pratique constaté aujourd'hui… ») figure dans les deux mesures",fix:"Garder la phrase dans la mesure 4 seulement.",t:"err",img:"p25-repetition"},
    {p:26,where:"P9, constat",cur:"« Depuis 2024, la répartition du coût moyen de l'AT/MP est désormais partagée à égalité »",fix:"« Depuis le décret du 5 juillet 2024, le coût de tous les AT/MP des intérimaires est partagé à égalité. Il pèse sur les taux à partir de 2026, avec un plein effet en 2028. » Avant, le partage ne visait que les sinistres graves.",t:"chk",img:"p26-depuis-2024",src:{label:"Légifrance",url:"https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000049892022"}},
    {p:34,where:"P12, constat",cur:"Ne mentionne pas les règles entrées en vigueur en 2026",fix:"Ajouter : arrêts plafonnés à 31 jours puis 62 jours par prolongation depuis le 1er septembre 2026 (décret du 12 juin 2026), et contre-visite qui permet d'arrêter le maintien de salaire (loi contre les fraudes de 2026).",t:"upd",src:{label:"Code du travail numérique",url:"https://code.travail.gouv.fr/actualite/arret-maladie-quelle-est-la-duree-maximale-dun-arret-de-travail-a-partir-du-1er-septembre-2026"}},
    {p:45,where:"Conclusion",cur:"« En assistant les employeurs dans leurs démarches »",fix:"« En accompagnant les employeurs dans leurs démarches ».",t:"voc",img:"p45-assistant"}
  ];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function count(f){return fixes.filter(f).length;}

  var ft=document.getElementById('f-type'), shown=[];
  ft.innerHTML='<option value="">Tous les types</option>'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'">'+TYPES[k]+' ('+count(function(f){return f.t===k;})+')</option>';}).join('');
  function render(){
    var list=fixes.filter(function(f){return !ft.value||f.t===ft.value;});
    shown=list.filter(function(f){return f.img;});
    document.querySelector('#fix tbody').innerHTML=list.map(function(f){
      var i=fixes.indexOf(f);
      var img=f.img?'<button class="shot" data-i="'+i+'" aria-label="Agrandir la capture de la page '+f.p+'"><img src="captures/'+f.img+'.png" alt="Page '+f.p+' du livre blanc, passage entouré" loading="lazy"></button>':'<span class="dim">Ajout, rien à entourer</span>';
      var links=[];
      if(f.img)links.push('<button data-i="'+i+'">Voir la capture</button>');
      if(f.src)links.push('<a href="'+f.src.url+'" target="_blank" rel="noopener">'+esc(f.src.label)+' ↗</a>');
      return '<tr><td class="n">'+f.p+'</td><td class="prop">'+esc(f.where)+'</td><td data-l="Texte actuel">'+esc(f.cur)+'</td><td data-l="Correction proposée">'+esc(f.fix)+'</td><td data-l="Type"><span class="status"><span class="dot '+TYPE_DOT[f.t]+'"></span>'+TYPES[f.t]+'</span></td><td data-l="Capture">'+img+'</td><td data-l="Lien"><div class="links">'+(links.join('')||'<span class="dim">·</span>')+'</div></td></tr>';
    }).join('');
    document.getElementById('count2').textContent=list.length+' sur '+fixes.length;
    var b=document.getElementById('fb-type');b.classList.toggle('on',!!ft.value);b.querySelector('.lbl').textContent=ft.value?TYPES[ft.value]:'Type';
  }
  ft.addEventListener('change',render);
  render();

  // Viewer
  var dlg=document.getElementById('viewer'),cur=0;
  function show(k){
    cur=k;var f=shown[k];
    document.getElementById('v-img').src='captures/'+f.img+'.png';
    document.getElementById('v-img').alt='Page '+f.p+' du livre blanc, passage entouré';
    document.getElementById('v-title').textContent='Page '+f.p+' · '+TYPES[f.t];
    document.getElementById('v-where').textContent=f.where;
    document.getElementById('v-fix').textContent=f.fix;
    document.getElementById('v-pos').textContent=(k+1)+' sur '+shown.length;
    document.getElementById('v-prev').disabled=k===0;
    document.getElementById('v-next').disabled=k===shown.length-1;
  }
  document.querySelector('#fix tbody').addEventListener('click',function(e){
    var t=e.target.closest('[data-i]');if(!t)return;
    var f=fixes[Number(t.dataset.i)];var k=shown.indexOf(f);if(k<0)return;
    show(k);if(!dlg.open)dlg.showModal();
  });
  document.getElementById('v-prev').addEventListener('click',function(){if(cur>0)show(cur-1);});
  document.getElementById('v-next').addEventListener('click',function(){if(cur<shown.length-1)show(cur+1);});
  document.getElementById('v-close').addEventListener('click',function(){dlg.close();});
  dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close();});
  dlg.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'&&cur>0)show(cur-1);if(e.key==='ArrowRight'&&cur<shown.length-1)show(cur+1);});
})();
</script>
</body>
</html>
